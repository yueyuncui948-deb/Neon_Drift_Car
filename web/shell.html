<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#status { background: #080e21; font-family: system-ui, sans-serif; }
#status-splash { display: none; }
#loading-title { display: grid; gap: 18px; text-align: center; }
#loading-title b { color: #2de4ef; font-size: clamp(32px, 6vw, 68px); letter-spacing: .1em; }
#loading-title span { color: #edf6ff; font-size: 20px; }
#loading-title small { color: #91a8c5; }
#status-detail { color: #91a8c5; margin: 20px; text-align: center; }
#retry { display: none; margin: 18px; padding: 12px 28px; border: 1px solid #2de4ef; border-radius: 6px; background: #143345; color: white; cursor: pointer; font-size: 18px; }
#status-progress { accent-color: #2de4ef; bottom: 28%; height: 6px; max-width: 460px; }
</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			你的瀏覽器不支援畫布，請使用近期版本的 Chrome、Edge、Firefox 或 Safari。
		</canvas>

		<noscript>
			請啟用 JavaScript 才能遊玩。
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="loading-title"><b>NEON DRIFT</b><span>霓虹甩尾 · 正在載入夜間賽道</span><small>首次載入約 36 MB，請稍候</small></div>
			<progress id="status-progress" aria-label="遊戲下載進度"></progress>
            <div id="status-detail" role="status" aria-live="polite">正在連線…</div>
            <button id="retry" type="button" onclick="window.location.reload()">重新載入</button>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
    const detail = document.getElementById('status-detail');
    const retry = document.getElementById('retry');

	let initializing = true;
	let statusMode = '';

    // Some engine download failures reject outside startGame's promise chain.
    function loadingRejection(event) {
        if (initializing) {
            event.preventDefault();
            displayFailureNotice(event.reason);
        }
    }
    window.addEventListener('unhandledrejection', loadingRejection);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
            window.removeEventListener('unhandledrejection', loadingRejection);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
        document.querySelector('#loading-title span').textContent = '載入未完成';
        detail.textContent = '請檢查網路連線，再按重新載入。';
        retry.style.display = 'block';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('載入發生錯誤，請重新整理頁面。');
		}
		setStatusMode('notice');
        window.removeEventListener('unhandledrejection', loadingRejection);
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = '無法啟動遊戲。瀏覽器缺少以下功能，請確認 WebGL 2.0 與硬體加速已啟用：\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
                if (!initializing) return;
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
                    const percent = Math.min(100, Math.floor(current / total * 100));
                    detail.textContent = current >= total ? '下載完成，正在初始化賽道…' :
                        `下載 ${percent}% · ${(current / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
                    detail.textContent = '正在下載遊戲資料…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
